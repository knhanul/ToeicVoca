server {
    listen 80;
    server_name knbada.duckdns.org;

    # 기본 루트는 유지하되, /toeicvoca/ 경로를 별도로 지정합니다.
    location /toeicvoca/ {
        alias /var/www/ToeicVoca/frontend/dist/; # 끝에 슬래시 필수
        index index.html;
        try_files $uri $uri/ /toeicvoca/index.html;
    }

    # 백엔드 API (기존 유지 혹은 필요시 변경)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
